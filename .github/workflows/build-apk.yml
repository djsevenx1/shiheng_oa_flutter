name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Get dependencies
        run: flutter pub get

      - name: Build Release APK (universal - all ABIs)
        run: flutter build apk --release

      - name: Create output directory
        run: mkdir -p output

      - name: Copy APK to output
        run: |
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk output/shiheng-oa-universal.apk
          fi
          ls -lh output/

      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: shiheng-oa-universal
          path: output/shiheng-oa-universal.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/shiheng-oa-universal.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## OA v${{ github.ref_name }}

            ### 安装说明
            下载 `shiheng-oa-universal.apk` 安装即可（支持所有架构）。
