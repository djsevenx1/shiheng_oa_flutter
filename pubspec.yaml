name: shiheng_oa
description: "移动办公平台"
publish_to: 'none'

version: 2.7.1+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: any
  dio: any
  get: any
  get_storage: any
  flutter_screenutil: any
  flutter_svg: any
  cached_network_image: any
  intl: any
  fl_chart: any
  shimmer: ^2.0.0
  flutter_staggered_grid_view: any
  pull_to_refresh: any
  flutter_smart_dialog: any

  # 推送（个推）
  getuiflut: ^0.2.31

  # 拼音搜索（知识库）
  lpinyin: ^2.0.0

  # 文档预览（PDF）
  flutter_pdfview: ^1.3.4
  open_filex: ^4.4.0
  file_picker: ^8.0.0
  path_provider: ^2.1.3

  # 注意：flutter_quill 10.x 与 quill_native_bridge_windows 0.0.2 在 Flutter 3.22.2
  # 下编译失败（`GMEM_MOVEABLE` 缺失）。暂时移除，待升级 Flutter 3.27+ 再恢复。
  # 富文本组件已用轻量 markdown TextField 替代：lib/app/widgets/rich_text_editor.dart

  # 注意：im_flutter_sdk 4.10 的 Windows bridge / 命名空间与当前 Flutter 不匹配；
  # IM 会话列表改为占位 + 后端拉取方式，登录后真实接环信 token 由后端签发。

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
